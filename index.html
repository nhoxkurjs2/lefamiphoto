<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang web của lefami</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 40px 20px;
    }
    h1 {
      margin: 0;
    }
    section {
      padding: 30px 20px;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }
    footer {
      margin-top: 40px;
      padding: 15px;
      background-color: #eee;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Xin chào! Đây là trang web của tôi</h1>
    <p>Được tạo bằng HTML và host miễn phí trên GitHub Pages</p>
  </header>

  <section>
    <h2>Giới thiệu</h2>
    <p>Đây là một trang web đơn giản để bắt đầu học lập trình web.</p>
    <a class="btn" href="#">Nhấn vào đây</a>
  </section>

  <footer>
    <p>© 2026 - Trang web thử nghiệm</p>
  </footer>
</body>
</html>
